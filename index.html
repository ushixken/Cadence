                    ><input type="checkbox" />
                    <span>Increment: 45°</span></label
                  >
                </section>
                <div class="snap-menu-divider"></div>
                <button class="snap-settings" type="button">
                  Snap Settings...
                </button>
              </div>
            </div>
            <div class="footer-dropdown units-control-wrap">
              <button
                class="units-control"
                type="button"
                aria-expanded="false"
                aria-controls="units-menu"
              >
                Units: <strong data-unit-value>mm</strong>
                <svg
                  class="dropdown-icon"
                  viewBox="0 0 12 12"
                  aria-hidden="true"
                >
                  <path d="M2.5 4.5 6 8l3.5-3.5" />
                </svg>
              </button>
              <div class="units-menu" id="units-menu" hidden>
                <div class="unit-section-title">Metric</div>
                <button
                  class="unit-option is-selected"
                  type="button"
                  data-unit="mm"
                >
                  <span>Millimeters (mm)</span><span class="unit-check">✓</span>
                </button>
                <button class="unit-option" type="button" data-unit="cm">
                  <span>Centimeters (cm)</span><span class="unit-check">✓</span>
                </button>
                <button class="unit-option" type="button" data-unit="m">
                  <span>Meters (m)</span><span class="unit-check">✓</span>
                </button>
                <div class="unit-section-title">Imperial</div>
                <button class="unit-option" type="button" data-unit="in">
                  <span>Inches (in)</span><span class="unit-check">✓</span>
                </button>
                <button class="unit-option" type="button" data-unit="ft">
                  <span>Feet (ft)</span><span class="unit-check">✓</span>
                </button>
                <div class="snap-menu-divider"></div>
                <button class="snap-settings" type="button">
                  Unit Settings...
                </button>
              </div>
            </div>
          </div>
        </footer>
      </div>
    </main>
  </body>
</html>
